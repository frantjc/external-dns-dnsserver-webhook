name: CI
on:
  workflow_dispatch: {}
  push:
    branches:
      - "**"
env:
  DAGGER_NO_NAG: "1"
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          install_args: dagger
      - name: Dagger check
        run: dagger check
