name: Release
on:
  push:
    tags:
      - v[0-9]+.[0-9]+.[0-9]+*
env:
  DAGGER_NO_NAG: "1"
concurrency:
  group: release
  cancel-in-progress: true
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v4
        with:
          install_args: dagger
      - name: Dagger ship
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          dagger api call ship
          --github-token=env://GITHUB_TOKEN
